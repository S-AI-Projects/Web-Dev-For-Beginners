<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Game - Collision Detection</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    #canvas {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      border: 2px solid #333;
    }
    #canvas:focus-visible {
      outline: 4px solid #00e5ff;
      outline-offset: 4px;
    }
    .motion-badge {
      display: none;
      background: #0074d9;
      color: #fff;
      padding: 4px 8px;
      margin: 6px auto;
      border-radius: 4px;
      font-size: 0.85rem;
      width: fit-content;
    }
    @media (prefers-reduced-motion: reduce) {
      .motion-badge {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="motion-badge" id="motionBadge">Reduced motion preference active</div>
  <canvas id="canvas" width="1024" height="768" tabindex="0" aria-label="Space arcade battle game"></canvas>
  <script src="app.js"></script>
</body>
</html>
