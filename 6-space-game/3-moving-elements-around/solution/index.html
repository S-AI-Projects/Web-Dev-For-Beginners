<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Game - Moving Elements</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #canvas {
      border: 1px solid #333;
    }
    .fallback-banner {
      display: none;
      padding: 1rem 1.5rem;
      background: #2a1111;
      border: 1px solid #ff4d4d;
      color: #ff9999;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 1rem;
      max-width: 600px;
      text-align: center;
    }
    .fallback-banner[data-visible="true"] {
      display: block;
    }
    @supports not (display: flex) {
      .fallback-banner {
        display: block;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1024" height="768">
    <p id="canvas-fallback-text">Your browser does not support the HTML5 canvas element.</p>
  </canvas>
  <div id="fallback-banner" class="fallback-banner" role="alert" aria-live="polite">
    <span id="fallback-message">Canvas 2D context is not supported in this browser.</span>
  </div>
  <script src="app.js"></script>
</body>
</html>
