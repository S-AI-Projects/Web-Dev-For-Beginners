<!DOCTYPE html>
<html lang="en">
<head>
    <title>Welcome to my Virtual Terrarium</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="./style.css" />
    <!-- import the webpage's JavaScript file -->
    <script src="./script.js" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <div id="page">
        <!-- Navigation Bar -->
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fas fa-leaf"></i> Plants</a></li>
                <li><a href="#"><i class="fas fa-seedling"></i> Care Tips</a></li>
                <li><a href="#"><i class="fas fa-info-circle"></i> About</a></li>
                <li><a href="#"><i class="fas fa-envelope"></i> Contact</a></li>
            </ul>
        </nav>

        <header>
            <h1><i class="fas fa-jar"></i> My Terrarium</h1>
            <p>Welcome to your virtual plant paradise! <i class="fas fa-smile-beam"></i></p>
        </header>

        <main id="main">
            <section id="plant-selection" aria-label="Plant Selection">
                <div id="left-container" class="container">
                    <!-- Left-side plants -->
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 1 - Peace Lily" id="plant1" src="./images/plant1.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 2 - Snake Plant" id="plant2" src="./images/plant2.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 3 - Fiddle Leaf Fig" id="plant3" src="./images/plant3.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 4 - Pothos" id="plant4" src="./images/plant4.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 5 - Monstera" id="plant5" src="./images/plant5.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 6 - Aloe Vera" id="plant6" src="./images/plant6.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 7 - Calathea" id="plant7" src="./images/plant7.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                </div>
                <div id="right-container" class="container">
                    <!-- Right-side plants -->
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 8 - Succulent" id="plant8" src="./images/plant8.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 9 - Fern" id="plant9" src="./images/plant9.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 10 - Spider Plant" id="plant10" src="./images/plant10.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 11 - Rubber Plant" id="plant11" src="./images/plant11.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 12 - ZZ Plant" id="plant12" src="./images/plant12.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 13 - Philodendron" id="plant13" src="./images/plant13.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                    <div class="plant-holder">
                        <img class="plant" alt="Plant 14 - Jade Plant" id="plant14" src="./images/plant14.png" tabindex="0" role="button" aria-pressed="false" />
                    </div>
                </div>
            </section>

            <section id="terrarium-section" aria-label="Terrarium Display">
                <div id="terrarium">
                    <div class="jar-top"></div>
                    <div class="jar-walls">
                        <div class="jar-glossy-long"></div>
                        <div class="jar-glossy-short"></div>
                    </div>
                    <div class="dirt"></div>
                    <div class="jar-bottom"></div>
                </div>
            </section>
        </main>

        <footer>
            <p>
                <i class="fas fa-copyright"></i> 2025 My Terrarium. All rights reserved.
            </p>
        </footer>
    </div>
</body>
</html>
